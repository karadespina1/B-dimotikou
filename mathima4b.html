  <!-- Sound Synthesizer -->
  <script>
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundStatus').textContent = soundEnabled ? 'ON' : 'OFF';
      document.getElementById('soundToggle').classList.toggle('bg-gray-200', !soundEnabled);
      if (soundEnabled) playSound('click');
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc.start(now);
        osc.stop(now + 0.55);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(180, now + 0.15);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(700, now + 0.18);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  </script>

            prompt: "Σωστό ή Λάθος: Στο μοτίβο, τα πράγματα μπαίνουν με μια σειρά που επαναλαμβάνεται.",
            sub: "Σκέψου αν υπάρχει κανόνας:",
            type: "tf",
            gridSetup: { start: [2,2], target: [4,2], lilies: [[3,2],[4,2]], path: [[3,2],[4,2]] },
            blockPreview: [{ type: "repeat", count: 3, inner: ["🐸", "🦆"] }],
            correctAnswer: true
          }
        ]
      },

      // 7. Βρες το Λάθος!
      {
        title: "Βρες το Λάθος!",
        category: "Μικρός Ντετέκτιβ",
        substeps: [
          {
            prompt: "Θέλουμε 3 άλματα. Το παιδί έγραψε τον αριθμό 1 στο κυκλάκι. Τι πρέπει να βάλει;",
            sub: "Διάλεξε τον σωστό αριθμό:",
            type: "choice",
            gridSetup: { start: [1,3], target: [4,3], lilies: [[2,3],[3,3],[4,3]], path: [[2,3],[3,3],[4,3]] },
            blockPreview: [{ type: "repeat", count: 3, inner: ["➡️ 1"] }],
            options: [
              { text: "Τον αριθμό 3! 🎯", correct: true },
              { text: "Τον αριθμό 0!", correct: false }
            ]
          },
          {
            prompt: "Το βατραχάκι θέλει να πάει δεξιά ➡️ αλλά το παιδί έβαλε βελάκι κάτω ⬇️. Ποιο βελάκι είναι το σωστό;",
            sub: "Διάλεξε την κατεύθυνση:",
            type: "choice",
            gridSetup: { start: [1,3], target: [4,3], lilies: [[2,3],[3,3],[4,3]], path: [[2,3],[3,3],[4,3]] },
            blockPreview: [{ type: "repeat", count: 3, inner: ["➡️ 1"] }],
            options: [
              { text: "Το βελάκι Δεξιά ➡️", correct: true },
              { text: "Το βελάκι Πάνω ⬆️", correct: false }
            ]
          },
          {
            prompt: "Σωστό ή Λάθος: Όταν αλλάζουμε τον αριθμό στο κυκλάκι, αλλάζουν και οι φορές που θα γίνει η κίνηση.",
            sub: "Σκέψου τι μάθαμε:",
            type: "tf",
            gridSetup: { start: [1,3], target: [4,3], lilies: [[2,3],[3,3],[4,3]], path: [[2,3],[3,3],[4,3]] },
            blockPreview: [{ type: "repeat", count: 3, inner: ["➡️ 1"] }],
            correctAnswer: true
          }
        ]
      },

      // 8. Μεγάλος Νικητής!
      {
        title: "Μεγάλος Νικητής!",
        category: "Συγχαρητήρια!",
        substeps: [
          {
            prompt: "Όταν βλέπουμε ένα πρόγραμμα επανάληψης, κοιτάμε πρώτα:",
            sub: "Τι προσέχουμε πρώτο;",
            type: "choice",
            gridSetup: { start: [3,3], target: [3,3], lilies: [[3,3]], path: [[3,3]] },
            blockPreview: [{ type: "repeat", count: 4, inner: ["⭐ Μπράβο!"] }],
            options: [
              { text: "Ποιες εντολές είναι μέσα στην αγκαλιά του! 🧩", correct: true },
              { text: "Το χρώμα του γραφείου μας 🎨", correct: false }
            ]
          },
          {
            prompt: "Και μετά κοιτάμε τον αριθμό στο κυκλάκι για να δούμε:",
            sub: "Τι μας λέει ο αριθμός;",
            type: "choice",
            gridSetup: { start: [3,3], target: [3,3], lilies: [[3,3]], path: [[3,3]] },
            blockPreview: [{ type: "repeat", count: 4, inner: ["⭐ Μπράβο!"] }],
            options: [
              { text: "Πόσες φορές θα γίνουν οι εντολές! 🔁", correct: true },
              { text: "Πόσο χρονών είναι ο δάσκαλος 🎂", correct: false }
            ]
          },
          {
            prompt: "Είσαι έτοιμος να φτιάξεις τα δικά σου προγράμματα στο ScratchJr;",
            sub: "Διάλεξε πόσο σούπερ τα πήγες σήμερα:",
            type: "choice",
            gridSetup: { start: [3,3], target: [3,3], lilies: [[3,3]], path: [[3,3]] },
            blockPreview: [{ type: "repeat", count: 5, inner: ["🏆 Άριστα!"] }],
            options: [
              { text: "🌟 Ναι! Είμαι σούπερ προγραμματιστής!", correct: true },
              { text: "👍 Τα κατάλαβα όλα πολύ εύκολα!", correct: true },
              { text: "🎉 Ήταν πανεύκολο και διασκεδαστικό!", correct: true }
            ]
          }
        ]
      }
    ];

    let currentActIndex = 0;
    let currentSubIndex = 0;
    let starsCount = 0;
    const answeredSteps = new Set();
    let isTransitioning = false;
    let isAnimatingFrog = false;

    window.onload = function() {
      renderNav();
      loadCurrentQuestion();
    };

    function renderNav() {
      const navContainer = document.getElementById('navBubbles');
      navContainer.innerHTML = '';
      activities.forEach((act, idx) => {
        const btn = document.createElement('button');
        btn.id = `act-bubble-${idx}`;
        const isActive = idx === currentActIndex;
        btn.className = `py-2 px-1 rounded-2xl font-black text-sm sm:text-base border-3 transition flex flex-col items-center justify-center gap-0.5 ${
          isActive 
            ? 'bg-amber-400 text-amber-950 border-amber-600 shadow-md scale-105' 
            : 'bg-white text-gray-700 border-gray-200 hover:bg-amber-50'
        }`;
        btn.innerHTML = `
          <span>Δρ.${idx + 1}</span>
          <span class="text-xs text-teal-800">${getActProgressIcon(idx)}</span>
        `;
        btn.onclick = () => {
          if (isTransitioning || isAnimatingFrog) return;
          playSound('click');
          currentActIndex = idx;
          currentSubIndex = 0;
          renderNav();
          loadCurrentQuestion();
        };
        navContainer.appendChild(btn);
      });

      const dotContainer = document.getElementById('substepDots');
      dotContainer.innerHTML = '';
      for (let s = 0; s < 3; s++) {
        const dot = document.createElement('div');
        const isCurrent = s === currentSubIndex;
        const isDone = answeredSteps.has(`${currentActIndex}-${s}`);
        dot.className = `w-9 h-9 sm:w-11 sm:h-11 rounded-full flex items-center justify-center font-black text-base sm:text-lg border-2 transition ${
          isCurrent 
            ? 'bg-teal-600 text-white border-teal-800 shadow scale-110' 
            : isDone 
              ? 'bg-emerald-400 text-white border-emerald-600' 
              : 'bg-gray-100 text-gray-400 border-gray-300'
        }`;
        dot.textContent = isDone ? '✓' : (s + 1);
        dotContainer.appendChild(dot);
      }

      document.getElementById('actIndicator').textContent = `Δραστηριότητα ${currentActIndex + 1} από 8: ${activities[currentActIndex].title}`;
      document.getElementById('starCounter').textContent = `⭐ ${starsCount}/24`;
    }

    function getActProgressIcon(actIdx) {
      const c1 = answeredSteps.has(`${actIdx}-0`);
      const c2 = answeredSteps.has(`${actIdx}-1`);
      const c3 = answeredSteps.has(`${actIdx}-2`);
      if (c1 && c2 && c3) return '⭐⭐⭐';
      if ((c1 && c2) || (c2 && c3) || (c1 && c3)) return '⭐⭐';
      if (c1 || c2 || c3) return '⭐';
      return '⚪';
    }

    function loadCurrentQuestion() {
      isTransitioning = false;
      const act = activities[currentActIndex];
      const q = act.substeps[currentSubIndex];

      document.getElementById('actCategory').textContent = act.category;
      document.getElementById('questionPrompt').textContent = q.prompt;
      document.getElementById('questionSub').textContent = q.sub;

      renderPond(q.gridSetup);
      renderCodeVisual(q.blockPreview);

      const fbBox = document.getElementById('feedbackContainer');
      fbBox.className = 'p-4 rounded-2xl border-2 border-gray-200 bg-gray-50 flex items-center justify-between min-h-[72px]';
      document.getElementById('feedbackText').innerHTML = `<span>💡</span> <span>Πάτησε τη σωστή απάντηση!</span>`;
      document.getElementById('autoNextTimer').classList.add('hidden');

      const container = document.getElementById('questionInteractiveArea');
      container.innerHTML = '';

      if (q.type === 'choice') {
        const shuffled = shuffle(q.options);
        const letters = ['Α', 'Β', 'Γ'];
        shuffled.forEach((opt, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'w-full text-left p-4 sm:p-5 rounded-2xl bg-sky-50 hover:bg-sky-100 active:scale-[0.99] border-3 border-sky-200 hover:border-sky-400 font-black text-xl sm:text-2xl text-gray-800 transition flex items-center gap-4 shadow-sm';
          btn.innerHTML = `
            <span class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl bg-sky-500 text-white flex items-center justify-center text-2xl font-black shrink-0 shadow">
              ${letters[optIdx] || '•'}
            </span>
            <span class="leading-snug">${opt.text}</span>
          `;
          btn.onclick = () => handleChoiceAnswer(btn, opt.correct);
          container.appendChild(btn);
        });
      } else if (q.type === 'tf') {
        const tfOptions = shuffle([
          { text: "ΣΩΣΤΟ 👍", val: true, bg: "bg-emerald-100 hover:bg-emerald-200 border-emerald-400 text-emerald-950" },
          { text: "ΛΑΘΟΣ 👎", val: false, bg: "bg-rose-100 hover:bg-rose-200 border-rose-400 text-rose-950" }
        ]);

        const tfGrid = document.createElement('div');
        tfGrid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-4';
        tfOptions.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = `p-6 sm:p-8 rounded-3xl border-4 font-black text-3xl sm:text-4xl text-center shadow transition transform active:scale-95 ${opt.bg}`;
          btn.textContent = opt.text;
          btn.onclick = () => handleChoiceAnswer(btn, opt.val === q.correctAnswer);
          tfGrid.appendChild(btn);
        });
        container.appendChild(tfGrid);
      }
    }

    function renderPond(setup) {
      const gridEl = document.getElementById('pondGrid');
      gridEl.innerHTML = '';

      const startX = setup.start[0];
      const startY = setup.start[1];
      const targetX = setup.target[0];
      const targetY = setup.target[1];

      for (let y = 1; y <= 5; y++) {
        for (let x = 1; x <= 5; x++) {
          const cell = document.createElement('div');
          cell.id = `cell-${x}-${y}`;
          cell.className = 'frog-cell w-11 h-11 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-xl border-2 border-emerald-300/80 bg-cyan-100/70 flex flex-col items-center justify-center text-center relative overflow-hidden shadow-inner';

          const isStart = (x === startX && y === startY);
          const isTarget = (x === targetX && y === targetY);
          const hasLily = setup.lilies.some(p => p[0] === x && p[1] === y);

          let content = '';
          if (hasLily) {
            content += `<span class="text-xl sm:text-2xl z-0 select-none opacity-90">🪷</span>`;
          }
          if (isStart) {
            content = `<span id="frogSprite" class="text-3xl sm:text-4xl md:text-5xl z-10 frog-bounce">🐸</span>`;
          } else if (isTarget && !isStart) {
            content = `<span class="text-2xl sm:text-3xl select-none">🏁</span>`;
          }

          cell.innerHTML = content;
          gridEl.appendChild(cell);
        }
      }
    }

    function renderCodeVisual(blocks) {
      const box = document.getElementById('codeVisualBlocks');
      box.innerHTML = '';
      if (!blocks || !blocks.length) return;

      blocks.forEach(b => {
        if (b.type === 'repeat') {
          const wrap = document.createElement('div');
          wrap.className = 'block-repeat rounded-2xl p-2 px-3 text-white flex items-center gap-2 shadow-md';
          
          let innerHtml = '';
          b.inner.forEach(cmd => {
            innerHtml += `<span class="block-motion px-2.5 py-1 rounded-xl text-white font-black text-base sm:text-lg border border-sky-200 shadow-inner">${cmd}</span>`;
          });

          wrap.innerHTML = `
            <div class="flex items-center gap-1 font-black text-base sm:text-lg">
              <span>🔁</span>
              <span>Επανάλαβε</span>
            </div>
            <div class="flex items-center gap-1 bg-white/25 p-1 rounded-xl">
              ${innerHtml}
            </div>
            <div class="w-9 h-9 rounded-full bg-white text-orange-950 font-black text-xl flex items-center justify-center shadow">
              ${b.count}
            </div>
          `;
          box.appendChild(wrap);
        }
      });
    }

    async function animateFrogPath() {
      if (isAnimatingFrog) return;
      isAnimatingFrog = true;
      const btn = document.getElementById('runJumpBtn');
      btn.classList.add('opacity-75', 'cursor-not-allowed');

      const q = activities[currentActIndex].substeps[currentSubIndex];
      const path = q.gridSetup.path;
      const start = q.gridSetup.start;

      renderPond(q.gridSetup);
      let currentPos = [...start];

      for (let i = 0; i < path.length; i++) {
        await new Promise(r => setTimeout(r, 450));
        playSound('jump');

        const next = path[i];
        const oldCell = document.getElementById(`cell-${currentPos[0]}-${currentPos[1]}`);
        const newCell = document.getElementById(`cell-${next[0]}-${next[1]}`);

        if (oldCell) {
          oldCell.innerHTML = `<span class="text-xl opacity-40">🟢</span>`;
        }
        if (newCell) {
          newCell.innerHTML = `<span id="frogSprite" class="text-3xl sm:text-4xl md:text-5xl z-10 sparkle-anim">🐸</span>`;
          newCell.classList.add('bg-emerald-200');
        }
        currentPos = [...next];
      }

      await new Promise(r => setTimeout(r, 250));
      playSound('correct');
      btn.classList.remove('opacity-75', 'cursor-not-allowed');
      isAnimatingFrog = false;
    }

    function handleChoiceAnswer(btnElement, isCorrect) {
      if (isTransitioning) return;

      const fbBox = document.getElementById('feedbackContainer');
      const fbText = document.getElementById('feedbackText');
      const timerIndicator = document.getElementById('autoNextTimer');

      if (isCorrect) {
        isTransitioning = true;
        playSound('correct');

        btnElement.classList.remove('bg-sky-50', 'hover:bg-sky-100', 'border-sky-200');
        btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'scale-[1.02]', 'shadow-lg');

        const key = `${currentActIndex}-${currentSubIndex}`;
        if (!answeredSteps.has(key)) {
          answeredSteps.add(key);
          starsCount++;
          document.getElementById('starCounter').textContent = `⭐ ${starsCount}/24`;
        }

        fbBox.className = 'p-4 rounded-2xl border-2 border-emerald-400 bg-emerald-50 flex items-center justify-between min-h-[72px]';
        fbText.innerHTML = `<span class="text-4xl">🎉</span> <span class="text-emerald-800 text-xl sm:text-2xl font-black">Μπράβο! Το βρήκες!</span>`;
        timerIndicator.classList.remove('hidden');

        setTimeout(() => {
          advanceToNext();
        }, 1100);

      } else {
        playSound('wrong');
        btnElement.classList.add('bg-rose-100', 'border-rose-400');
        fbBox.className = 'p-4 rounded-2xl border-2 border-rose-300 bg-rose-50 flex items-center justify-between min-h-[72px]';
        fbText.innerHTML = `<span class="text-3xl">🤔</span> <span class="text-rose-800 font-black">Δοκίμασε ξανά! Κοίταξε τη λιμνούλα!</span>`;
      }
    }

    function advanceToNext() {
      if (currentSubIndex < 2) {
        currentSubIndex++;
      } else {
        if (currentActIndex < activities.length - 1) {
          currentActIndex++;
          currentSubIndex = 0;
        } else {
          showFinalCelebration();
          return;
        }
      }
      renderNav();
      loadCurrentQuestion();
    }

    function showFinalCelebration() {
      renderNav();
      const area = document.getElementById('questionInteractiveArea');
      document.getElementById('questionPrompt').textContent = "🏆 Συγχαρητήρια! Είσαι Αστέρι!";
      document.getElementById('questionSub').textContent = "Έμαθες τέλεια τα μοτίβα και τις επαναλήψεις!";

      area.innerHTML = `
        <div class="bg-gradient-to-r from-amber-200 via-emerald-200 to-sky-200 p-6 rounded-3xl text-center border-4 border-amber-400 flex flex-col items-center gap-4">
          <span class="text-6xl animate-bounce">👑 🐸 ⭐</span>
          <h4 class="text-2xl sm:text-3xl font-black text-teal-900">
            Κέρδισες και τα 24 Αστέρια!
          </h4>
          <p class="text-lg sm:text-xl font-bold text-gray-800 max-w-lg">
            Μπορείς τώρα να αποθηκεύσεις το παιχνίδι στον υπολογιστή σου!
          </p>
          <div class="flex flex-wrap gap-3 justify-center">
            <button onclick="downloadHTML()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xl py-3 px-6 rounded-2xl shadow-lg border-2 border-emerald-800 transition transform active:scale-95">
              💾 Αποθήκευση Αρχείου
            </button>
            <button onclick="restartAll()" class="bg-amber-500 hover:bg-amber-600 text-white font-black text-xl py-3 px-6 rounded-2xl shadow-lg border-2 border-amber-700 transition transform active:scale-95">
              🔄 Παίξε Ξανά
            </button>
          </div>
        </div>
      `;

      document.getElementById('feedbackText').innerHTML = `<span>🌟</span> <span class="text-amber-800 font-black">Τέλεια 24/24!</span>`;
      document.getElementById('autoNextTimer').classList.add('hidden');
    }

    function restartAll() {
      currentActIndex = 0;
      currentSubIndex = 0;
      starsCount = 0;
      answeredSteps.clear();
      renderNav();
      loadCurrentQuestion();
    }

    function downloadHTML() {
      const htmlContent = document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Pliroforiki_B_Dimotikou_Mathima4_Aplo.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
